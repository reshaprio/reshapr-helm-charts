{{- if not .Values.autoscaling.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reshapr-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reshapr-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "reshapr-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "reshapr-proxy.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "reshapr-proxy.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: reshapr-proxy
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- if .Values.clustering.enabled }}
            - name: jgroups
              containerPort: {{ .Values.clustering.jgroups.port }}
              protocol: TCP
            - name: jgroups-fd
              containerPort: {{ .Values.clustering.jgroups.fdPort }}
              protocol: TCP
            {{- end }}
          env:
            # Pod name for unique gateway ID
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.clustering.enabled }}
            # Pod IP for JGroups bind address (Downward API)
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # JAVA_OPTS_APPEND: base JVM flags + Infinispan clustering properties.
            # This REPLACES the Dockerfile default — keep base flags in sync with Dockerfile.jvm.
            - name: JAVA_OPTS_APPEND
              value: >-
                -XX:+UseCompactObjectHeaders
                -Dquarkus.http.host=0.0.0.0
                -Djava.util.logging.manager=org.jboss.logmanager.LogManager
                --enable-preview
                -Dreshapr.infinispan.stack=reshapr-k8s
                -Dreshapr.infinispan.dns-query={{ include "reshapr-proxy.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local
                -Djgroups.port_range=0
                -Djgroups.bind.address=$(POD_IP)
                -Dreshapr.infinispan.encrypt.keystore={{ .Values.clustering.encryption.keystoreMountPath }}/{{ .Values.clustering.encryption.keystoreFile }}
                -Dreshapr.infinispan.encrypt.store-password=$(RESHAPR_CLUSTER_STORE_PASSWORD)
                -Dreshapr.infinispan.encrypt.key-password=$(RESHAPR_CLUSTER_KEY_PASSWORD)
                -Dreshapr.infinispan.encrypt.alias={{ .Values.clustering.encryption.alias }}
            - name: RESHAPR_CLUSTER_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "reshapr-proxy.keystoreSecretName" . }}
                  key: {{ .Values.clustering.encryption.storePasswordKey }}
            - name: RESHAPR_CLUSTER_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "reshapr-proxy.keystoreSecretName" . }}
                  key: {{ .Values.clustering.encryption.keyPasswordKey }}
            {{- end }}
            # Gateway ID composed of prefix (if set) and pod name
            - name: RESHAPR_GATEWAY_ID
              value: {{ include "reshapr-proxy.gatewayId" . | quote }}
            # Gateway FQDNs
            - name: RESHAPR_GATEWAY_FQDNS
              value: {{ .Values.gateway.fqdns | quote }}
            # Gateway labels
            - name: RESHAPR_GATEWAY_LABELS
              value: {{ .Values.gateway.labels | quote }}
            # Control plane connection
            - name: RESHAPR_CTRL_HOST
              value: {{ .Values.gateway.controlPlane.host | quote }}
            - name: RESHAPR_CTRL_PORT
              value: {{ .Values.gateway.controlPlane.port | quote }}
            - name: RESHAPR_CTRL_TLS_PLAINTEXT
              value: {{ .Values.gateway.controlPlane.tlsPlainText | quote }}
            - name: RESHAPR_CTRL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "reshapr-proxy.tokenSecretName" . }}
                  key: {{ .Values.gateway.controlPlane.tokenKey }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.healthCheck.livenessProbe.enabled }}
          livenessProbe:
            {{- with .Values.healthCheck.livenessProbe.httpGet }}
            httpGet:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.healthCheck.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.healthCheck.readinessProbe.enabled }}
          readinessProbe:
            {{- with .Values.healthCheck.readinessProbe.httpGet }}
            httpGet:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.healthCheck.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.clustering.enabled }}
            - name: cluster-keystore
              mountPath: {{ .Values.clustering.encryption.keystoreMountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.clustering.enabled }}
        - name: cluster-keystore
          secret:
            secretName: {{ include "reshapr-proxy.keystoreSecretName" . }}
            items:
              - key: {{ .Values.clustering.encryption.keystoreFile }}
                path: {{ .Values.clustering.encryption.keystoreFile }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.affinity .Values.clustering.enabled }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else if .Values.clustering.enabled }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "reshapr-proxy.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
        {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
