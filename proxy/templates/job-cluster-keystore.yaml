{{- if and .Values.clustering.enabled (not .Values.clustering.encryption.existingSecret) }}
{{- $secretName := include "reshapr-proxy.keystoreSecretName" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "reshapr-proxy.fullname" . }}-keystore-gen
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reshapr-proxy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        {{- include "reshapr-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keystore-gen
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "reshapr-proxy.fullname" . }}-keystore-gen
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: generate-keystore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -c
            - |
              set -e
              STORE_PASSWORD=$(head -c 24 /dev/urandom | base64 | tr -d '\n')
              KEY_PASSWORD=$(head -c 24 /dev/urandom | base64 | tr -d '\n')
              echo -n "$STORE_PASSWORD" > /shared/store-password
              echo -n "$KEY_PASSWORD" > /shared/key-password
              keytool -genseckey \
                -alias {{ .Values.clustering.encryption.alias }} \
                -keyalg AES -keysize 256 \
                -storetype JCEKS \
                -keystore /shared/{{ .Values.clustering.encryption.keystoreFile }} \
                -storepass "$STORE_PASSWORD" \
                -keypass "$KEY_PASSWORD" \
                -noprompt
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: create-secret
          image: {{ .Values.clustering.encryption.kubectlImage }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              set -e
              kubectl create secret generic {{ $secretName }} \
                --namespace {{ .Release.Namespace }} \
                --from-file={{ .Values.clustering.encryption.keystoreFile }}=/shared/{{ .Values.clustering.encryption.keystoreFile }} \
                --from-literal=store-password="$(cat /shared/store-password)" \
                --from-literal=key-password="$(cat /shared/key-password)" \
                --dry-run=client -o yaml | kubectl apply -f -
              kubectl annotate secret {{ $secretName }} \
                --namespace {{ .Release.Namespace }} \
                "helm.sh/resource-policy=keep" --overwrite
              kubectl label secret {{ $secretName }} \
                --namespace {{ .Release.Namespace }} \
                "app.kubernetes.io/managed-by=Helm" \
                "app.kubernetes.io/instance={{ .Release.Name }}" --overwrite
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          emptyDir: {}
{{- end }}
