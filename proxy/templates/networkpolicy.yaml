{{- if and .Values.clustering.enabled .Values.clustering.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reshapr-proxy.fullname" . }}-jgroups
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reshapr-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "reshapr-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "reshapr-proxy.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.clustering.jgroups.port }}
        - protocol: TCP
          port: {{ .Values.clustering.jgroups.fdPort }}
{{- end }}
