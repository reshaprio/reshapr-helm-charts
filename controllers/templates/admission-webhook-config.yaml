{{- if .Values.admissionController.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "controllers.fullname" . }}-validating-webhook-configuration
  labels:
    {{- include "controllers.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "controllers.fullname" . }}-serving-cert
webhooks:
  - name: vadmission.reshapr.io
    clientConfig:
      service:
        name: {{ include "controllers.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["reshapr.io"]
        apiVersions: ["v1alpha1"]
        resources: ["*"]
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    timeoutSeconds: 10
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "controllers.fullname" . }}-serving-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "controllers.labels" . | nindent 4 }}
spec:
  dnsNames:
  - {{ include "controllers.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc
  - {{ include "controllers.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "controllers.fullname" . }}-selfsigned-issuer
  secretName: {{ include "controllers.fullname" . }}-webhook-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "controllers.fullname" . }}-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "controllers.labels" . | nindent 4 }}
spec:
  selfSigned: {}
{{- end }}
