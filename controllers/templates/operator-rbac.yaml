{{- if .Values.operator.enabled }}
{{- if .Values.operator.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "controllers.operator.serviceAccountName" . }}
  labels:
    {{- include "controllers.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
  {{- with .Values.operator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- if .Values.operator.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "controllers.fullname" . }}-operator
  labels:
    {{- include "controllers.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  # Full access to the reshapr.io API group — required to reconcile every reShapr CR.
  - apiGroups: ["reshapr.io"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "controllers.fullname" . }}-operator
  labels:
    {{- include "controllers.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "controllers.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "controllers.operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.operator.rbac.createSecretReader }}
---
# Dedicated ClusterRole for reading Kubernetes Secrets referenced by SecretSource CRs via
# `spec.secrets[].valuesFrom.secretRef`. Kept separate so it can be scoped down (replace the
# ClusterRoleBinding below by namespaced RoleBindings) or disabled independently.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "controllers.fullname" . }}-operator-secret-reader
  labels:
    {{- include "controllers.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "controllers.fullname" . }}-operator-secret-reader
  labels:
    {{- include "controllers.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "controllers.fullname" . }}-operator-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "controllers.operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
