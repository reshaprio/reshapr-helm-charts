{{- if and .Values.serviceAccount.create (or .Values.operator.enabled .Values.admissionController.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "controllers.serviceAccountName" . }}
  labels:
    {{- include "controllers.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
