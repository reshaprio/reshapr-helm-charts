{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "controllers.fullname" . }}-operator
  labels:
    {{- include "controllers.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "controllers.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "controllers.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
      {{- with .Values.operator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "controllers.operator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "controllers.operator.image" . | quote }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: {{ include "controllers.fullname" . }}-operator
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.operator.healthCheck.livenessProbe.enabled }}
          livenessProbe:
            {{- with .Values.operator.healthCheck.livenessProbe.httpGet }}
            httpGet:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.operator.healthCheck.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.operator.healthCheck.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.operator.healthCheck.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.operator.healthCheck.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.operator.healthCheck.readinessProbe.enabled }}
          readinessProbe:
            {{- with .Values.operator.healthCheck.readinessProbe.httpGet }}
            httpGet:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            initialDelaySeconds: {{ .Values.operator.healthCheck.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.operator.healthCheck.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.operator.healthCheck.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.operator.healthCheck.readinessProbe.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/reshapr/serviceaccount
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  # Must match the control plane's hardcoded EXPECTED_AUDIENCE (KubernetesTokenVerifier).
                  audience: https://app.reshapr.io
                  expirationSeconds: {{ .Values.operator.controlPlane.tokenExpirationSeconds }}
                  path: token
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
